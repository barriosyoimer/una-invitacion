<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0}</style>
</head>
<body>
<title>Soldado Caído</title>
<style>
  :root{
    --bg: #0a0f1c;
    --bg-2: #131b30;
    --moon: #dbe4f5;
    --stone: #838b98;
    --stone-hi: #a9b0bc;
    --stone-dark: #2b2f36;
    --text: #eef1f8;
    --text-soft: #a3aec7;
    --rain: rgba(196,214,245,0.5);
    --line: rgba(255,255,255,0.09);
    --shadow: rgba(0,0,0,0.6);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(120% 70% at 50% -8%, var(--bg-2), var(--bg) 62%);
    color: var(--text);
    font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
    overflow-x: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: 24px 16px calc(22px + env(safe-area-inset-bottom, 0px));
    gap: 28px;
  }

  .moon{
    position: fixed;
    top: 8%; right: 12%;
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--moon), #9aa8c9 70%);
    box-shadow: 0 0 60px 18px rgba(219,228,245,0.18);
    opacity: .85;
    z-index: -2;
  }

  .rain{ position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
  .drop{
    position: absolute;
    top: -12%;
    width: 2px;
    background: linear-gradient(var(--rain), transparent);
    transform: rotate(10deg);
    animation-name: rainFall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes rainFall{ to{ transform: translateY(125vh) rotate(10deg); } }

  .flash{
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  .flash.on{ animation: flashPop .35s ease-out; }
  @keyframes flashPop{
    0%{ opacity: 0; }
    12%{ opacity: .5; }
    24%{ opacity: .05; }
    40%{ opacity: .32; }
    100%{ opacity: 0; }
  }

  .stage{
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .grave-row{
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 4px;
    animation: sceneIn .8s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes sceneIn{ from{ opacity: 0; transform: translateY(16px); } to{ opacity: 1; transform: translateY(0); } }

  .kneeling{
    font-size: clamp(50px, 15vw, 64px);
    transform: scaleX(-1);
    filter: drop-shadow(0 8px 10px var(--shadow));
    line-height: 1;
  }

  .tombstone{
    width: clamp(96px, 26vw, 116px);
    min-height: 118px;
    background: linear-gradient(180deg, var(--stone-hi), var(--stone));
    border: 2px solid rgba(0,0,0,0.3);
    border-radius: 50% 50% 8px 8px / 38% 38% 8px 8px;
    box-shadow: 0 14px 30px -10px var(--shadow), inset 0 -10px 16px -10px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 8px 12px;
    text-align: center;
  }
  .tombstone .rip{ margin: 0; font-size: 9px; letter-spacing: 1.5px; color: var(--stone-dark); opacity: .75; }
  .tombstone .initials{ margin: 5px 0; font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 27px; color: var(--stone-dark); }
  .tombstone .epitaph{ margin: 0; font-size: 8px; color: var(--stone-dark); opacity: .85; line-height: 1.35; }

  .caption{
    width: 100%;
    background: rgba(8,11,20,0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 20px;
    text-align: center;
    box-shadow: 0 20px 50px -18px var(--shadow);
    animation: capIn .8s cubic-bezier(.2,.8,.2,1) .1s both;
  }
  @keyframes capIn{ from{ opacity: 0; transform: translateY(14px); } to{ opacity: 1; transform: translateY(0); } }

  .caption h1{
    margin: 0;
    font-family: "Fredoka", "Nunito", sans-serif;
    font-size: clamp(19px, 5.6vw, 23px);
    font-weight: 700;
    text-wrap: balance;
  }
  .caption p{
    margin: 8px 0 0;
    color: var(--text-soft);
    font-size: 13.5px;
    line-height: 1.5;
  }

  @media (prefers-reduced-motion: reduce){
    .drop{ animation: none !important; opacity: .35; }
    .flash{ display: none !important; }
    .grave-row, .caption{ animation: none !important; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">

<div class="moon" aria-hidden="true"></div>
<div class="rain" id="rain" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>

<main class="stage">
  <div class="grave-row" aria-hidden="true">
    <span class="kneeling">🧎</span>
    <div class="tombstone">
      <p class="rip">R.I.P.</p>
      <p class="initials">YB</p>
      <p class="epitaph">"El que lo<br>intentó"</p>
    </div>
  </div>

  <div class="caption">
    <h1>Soldado caído… diste lo mejor de ti 🫡</h1>
    <p>Bajas: 1 corazón 💔 — sobrevive el sentido del humor 😂</p>
  </div>
</main>

<script>
(function(){
  "use strict";
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reduceMotion){
    var rainEl = document.getElementById('rain');
    var count = window.innerWidth < 480 ? 55 : 80;
    for (var i = 0; i < count; i++){
      var d = document.createElement('div');
      d.className = 'drop';
      var h = 40 + Math.random() * 55;
      var dur = 0.55 + Math.random() * 0.7;
      d.style.left = (Math.random() * 100) + '%';
      d.style.height = h + 'px';
      d.style.opacity = (0.25 + Math.random() * 0.45).toFixed(2);
      d.style.animationDuration = dur.toFixed(2) + 's';
      d.style.animationDelay = (-Math.random() * dur).toFixed(2) + 's';
      rainEl.appendChild(d);
    }

    var flashEl = document.getElementById('flash');
    function scheduleFlash(){
      var delay = 5000 + Math.random() * 6000;
      setTimeout(function(){
        flashEl.classList.remove('on');
        void flashEl.offsetWidth;
        flashEl.classList.add('on');
        scheduleFlash();
      }, delay);
    }
    scheduleFlash();
  }
})();
</script>

</body>
</html>
